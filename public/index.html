<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek-V4 Chat</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/confirm.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
            <button class="btn-primary" id="newChatBtn">+ New Chat</button>
        </div>
        <div class="conv-list" id="convList"></div>
    </aside>

    <main class="main" id="main">
        <header class="main-head" id="mainHead" style="display:none">
            <h2 id="chatTitle">Chat</h2>
            <span class="badge" id="branchBadge">main</span>
            <select id="branchSelect" style="max-width:200px"></select>
            <button class="btn-sm btn-ghost" id="forkBtn">Fork</button>
            <div class="btn-sm btn-ghost theme-box" id="themeBox">Theme: </div>
        </header>
        <div class="messages" id="msgContainer">
            <div class="empty">
                <h2>DeepSeek-V4 Chat</h2>
                <p>Start a new conversation</p>
            </div>
        </div>
        <div class="input-bar" id="inputBar" style="display:none">
            <textarea id="userInput" rows="1" placeholder="Message..."></textarea>
            <button class="btn-send" id="sendBtn">Send</button>
        </div>
    </main>

    <aside class="settings" id="settings" style="display:none">
        <h3>Model Settings</h3>
        <div class="field">
            <label>Model</label>
            <select id="sModel">
                <option value="deepseek-v4-pro">DeepSeek-V4 Pro</option>
                <option value="deepseek-v4-flash">DeepSeek-V4 Flash</option>
            </select>
        </div>
        <div class="field">
            <label>Reasoning Effort</label>
            <select id="sReason">
                <option value="high">High</option>
                <option value="max">Max</option>
            </select>
        </div>
        <div class="field">
            <label>Temperature (Default:0.7)</label>
            <div class="range-row">
                <input type="range" id="sTemp" min="0" max="2" step="0.1" value="0.7">
                <span class="val" id="tLabel">0.7</span>
            </div>
        </div>
        <div class="field">
            <label>Max Tokens</label>
            <input type="number" id="sMax" value="4096" min="1" max="65536">
        </div>
        <div class="field">
            <label>Top P (Default:1.0)</label>
            <div class="range-row">
                <input type="range" id="sTopP" min="0" max="1" step="0.05" value="1.0">
                <span class="val" id="pLabel">1.0</span>
            </div>
        </div>
        <div class="field">
            <label>System Prompt</label>
            <textarea id="sSys">You are a helpful assistant.</textarea>
        </div>
        <div class="field">
            <button class="btn-apply" id="applySettingsBtn">Apply Settings</button>
        </div>
        <div class="meta">
            <span id="branchMeta"></span>
            <span id="msgMeta"></span>
        </div>
        <div class="field">
            <button class="btn-apply" id="regenBtn" style="background:var(--bg3)">&#x21BB; Regenerate Last
                Reply</button>
        </div>
    </aside>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
