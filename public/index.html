<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek-V4 Chat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#1c1c1e;--bg1:#242426;--bg2:#2c2c2e;--bg3:#333336;
  --accent:#5e8cd6;--text:#e4e4e6;--muted:#888;
  --user-bg:#2d343a;--ai-bg:transparent;--border:#2e2e30;
  --radius:12px;--gap:16px;
}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg0);color:var(--text);height:100vh;display:flex;overflow:hidden}
button{cursor:pointer;border:none;outline:none;font-family:inherit;font-size:13px;transition:all .2s}
input,select,textarea{outline:none;font-family:inherit;font-size:13px;transition:border-color .2s}

/* ── Sidebar left ── */
.sidebar{width:260px;min-width:260px;background:var(--bg1);display:flex;flex-direction:column;border-right:1px solid var(--border)}
.sidebar-head{padding:var(--gap);border-bottom:1px solid var(--border);display:flex;gap:8px}
.sidebar-head button{flex:1;padding:10px;border-radius:10px;font-weight:600}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-secondary{background:var(--bg3);color:var(--muted)}
.btn-secondary:hover{background:var(--bg2);color:var(--text)}
.conv-list{flex:1;overflow-y:auto;padding:8px}
.conv-card{padding:12px;margin-bottom:4px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s}
.conv-card:hover{background:var(--bg2)}
.conv-card.active{background:var(--accent);color:#fff}
.conv-card .title{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-card .close{display:none;background:none;color:inherit;opacity:.5;padding:2px 6px;font-size:18px;border-radius:6px}
.conv-card:hover .close,.conv-card.active .close{display:block}
.conv-card .close:hover{opacity:1;background:rgba(255,255,255,.15)}
.list-empty{text-align:center;color:var(--muted);font-size:13px;margin-top:40px}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg0)}
.main-head{padding:10px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--bg1);flex-wrap:wrap}
.main-head h2{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.main-head select{padding:5px 10px;background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:8px}
.main-head select option{background:var(--bg1)}
.badge{font-size:10px;padding:3px 10px;background:var(--bg3);border-radius:20px;color:var(--muted);white-space:nowrap}
.btn-sm{padding:5px 12px;border-radius:7px;font-size:11px;font-weight:500}
.btn-ghost{background:var(--bg3);color:var(--muted)}
.btn-ghost:hover{background:var(--bg2);color:var(--text)}

/* ── Messages ── */
.messages{flex:1;overflow-y:auto;padding:20px;scroll-behavior:smooth}
.msg-wrap{margin-bottom:6px;display:flex;flex-direction:column}
.msg-wrap.user{align-items:flex-end}
.msg-wrap.assistant{align-items:flex-start}
.msg-wrap.system{align-items:center}
.msg-bubble{padding:12px 16px;border-radius:var(--radius);max-width:82%;position:relative;line-height:1.65}
.msg-wrap.user .msg-bubble{background:var(--user-bg);border-bottom-right-radius:4px}
.msg-wrap.assistant .msg-bubble{background:var(--ai-bg);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg-wrap.system .msg-bubble{background:var(--bg1);border:1px dashed var(--border);max-width:94%;font-size:12px;color:var(--muted)}
.msg-bubble .role-tag{font-size:10px;margin-bottom:5px;text-transform:uppercase;letter-spacing:.8px;opacity:.5;font-weight:600}
.msg-bubble .edit-trigger{position:absolute;top:6px;right:6px;background:var(--bg3);color:var(--muted);opacity:0;padding:3px 9px;border-radius:5px;font-size:11px;transition:opacity .2s}
.msg-bubble:hover .edit-trigger{opacity:1}
.msg-bubble .edit-trigger:hover{background:var(--accent);color:#fff}
.msg-bubble .bubble-body{display:block}
.msg-bubble .edit-form{display:none;flex-direction:column;gap:8px}
.msg-bubble.editing .bubble-body{display:none}
.msg-bubble.editing .edit-form{display:flex}
.msg-bubble.editing .edit-trigger{display:none}
.edit-form textarea{width:100%;min-height:80px;padding:10px;background:var(--bg0);color:var(--text);border:1px solid var(--accent);border-radius:8px;font-size:inherit;line-height:1.6;resize:vertical}
.edit-form .edit-row{display:flex;gap:8px;align-items:center}
.edit-form .edit-row .hint{font-size:11px;color:var(--muted);margin-left:auto}
.edit-form .btn-save{background:var(--accent);color:#fff;padding:6px 16px;border-radius:6px;font-weight:600}
.edit-form .btn-cancel{background:var(--bg3);color:var(--muted);padding:6px 16px;border-radius:6px}
.edit-form .btn-save:disabled{opacity:.5;cursor:wait}

/* ── Branch nav under messages ── */
.branch-nav{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:var(--muted);padding:4px 0;margin-top:2px}
.msg-wrap.user .branch-nav{align-self:flex-end}
.msg-wrap.assistant .branch-nav{align-self:flex-start}
.msg-wrap.system .branch-nav{align-self:center}
.branch-nav .nav-arrow{background:var(--bg3);color:var(--muted);padding:2px 8px;border-radius:4px;font-size:12px;line-height:1}
.branch-nav .nav-arrow:hover{background:var(--accent);color:#fff}
.branch-nav .nav-arrow:disabled{opacity:.3;cursor:default;pointer-events:none}
.branch-nav .nav-label{font-weight:500;min-width:60px;text-align:center}

/* ── Streaming cursor ── */
.streaming-cursor{display:inline-block;width:6px;height:14px;background:var(--accent);margin-left:2px;animation:blink .6s infinite;vertical-align:text-bottom}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ── Reasoning collapse ── */
.reasoning-wrap{border-left:3px solid var(--accent);margin:4px 0 8px;border-radius:0 8px 8px 0;overflow:hidden}
.reasoning-toggle{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--bg2);color:var(--accent);font-size:11px;cursor:pointer;user-select:none;border:none;width:100%;text-align:left;font-family:inherit;transition:background .15s}
.reasoning-toggle:hover{background:var(--bg3)}
.reasoning-toggle .arrow{transition:transform .2s;font-size:10px}
.reasoning-toggle.open .arrow{transform:rotate(90deg)}
.reasoning-body{display:none;padding:8px 12px;background:var(--bg1);font-size:12px;color:var(--muted);line-height:1.6;white-space:pre-wrap;max-height:300px;overflow-y:auto}
.reasoning-body.open{display:block}

/* ── Loading dots ── */
.dots{display:flex;align-items:center;gap:6px;padding:8px 16px}
.dots .d{width:7px;height:7px;background:var(--accent);border-radius:50%;animation:bounce .8s infinite ease-in-out}
.dots .d:nth-child(2){animation-delay:.1s}
.dots .d:nth-child(3){animation-delay:.2s}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}

/* ── Fork notice ── */
.fork-toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border);padding:10px 24px;border-radius:20px;font-size:12px;color:var(--accent);z-index:100;pointer-events:none;animation:toastIn .3s ease,toastOut .3s 2.5s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}

/* ── Input ── */
.input-bar{padding:var(--gap) 20px;border-top:1px solid var(--border);display:flex;gap:10px;background:var(--bg1)}
.input-bar textarea{flex:1;padding:10px 16px;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:12px;font-size:14px;line-height:1.5;resize:none;min-height:44px;max-height:180px}
.input-bar textarea:focus{border-color:var(--accent)}
.input-bar .btn-send{padding:10px 22px;background:var(--accent);color:#fff;border-radius:12px;font-weight:600;font-size:14px;white-space:nowrap}
.input-bar .btn-send:disabled{opacity:.5;cursor:not-allowed}

/* ── Settings ── */
.settings{width:280px;min-width:280px;background:var(--bg1);display:flex;flex-direction:column;border-left:1px solid var(--border);overflow-y:auto}
.settings h3{padding:16px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--border)}
.field{padding:12px 16px;border-bottom:1px solid var(--border)}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field select,.field input[type="number"],.field textarea{width:100%;padding:8px 10px;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:8px}
.field textarea{min-height:80px;resize:vertical}
.range-row{display:flex;align-items:center;gap:8px}
.range-row input[type="range"]{flex:1;accent-color:var(--accent)}
.range-row .val{font-size:12px;color:var(--accent);font-weight:600;min-width:34px;text-align:right}
.btn-apply{width:100%;padding:10px;margin-top:2px;border-radius:8px;font-weight:600;background:var(--accent);color:#fff}
.btn-apply:hover{transform:translateY(-1px);box-shadow:0 4px 15px rgba(94,140,214,.25)}
.btn-apply:disabled{opacity:.5;cursor:wait}
.settings .meta{padding:12px 16px;font-size:11px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}

/* ── Empty ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);gap:12px}
.empty h2{font-size:18px;font-weight:600;color:var(--text)}
.empty p{font-size:13px}

/* ── Markdown in bubbles ── */
.bubble-body h1,.bubble-body h2,.bubble-body h3{font-size:1.1em;font-weight:600;margin:8px 0 4px;color:#fff}
.bubble-body h2{font-size:1.05em}
.bubble-body h3{font-size:1em}
.bubble-body p{margin:4px 0}
.bubble-body ul,.bubble-body ol{margin:4px 0;padding-left:20px}
.bubble-body li{margin:2px 0}
.bubble-body code{background:rgba(255,255,255,.1);padding:1px 6px;border-radius:4px;font-size:.9em;font-family:'JetBrains Mono','Fira Code',monospace}
.bubble-body pre{background:var(--bg0);padding:12px 14px;border-radius:8px;overflow-x:auto;margin:6px 0;border:1px solid var(--border)}
.bubble-body pre code{background:none;padding:0}
.bubble-body strong{color:#fff;font-weight:600}
.bubble-body em{font-style:italic;opacity:.9}
.bubble-body a{color:var(--accent);text-decoration:underline}
.bubble-body blockquote{border-left:3px solid var(--accent);padding-left:12px;margin:6px 0;opacity:.85}
.bubble-body hr{border:none;border-top:1px solid var(--border);margin:10px 0}
</style>
</head>
<body>

<!-- ── Sidebar ── -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <button class="btn-primary" onclick="newConv()">+ New Chat</button>
  </div>
  <div class="conv-list" id="convList"></div>
</aside>

<!-- ── Main ── -->
<main class="main" id="main">
  <header class="main-head" id="mainHead" style="display:none">
    <h2 id="chatTitle">Chat</h2>
    <span class="badge" id="branchBadge">main</span>
    <select id="branchSelect" onchange="switchBranch()" style="max-width:200px"></select>
    <button class="btn-sm btn-ghost" onclick="forkBranch()">Fork</button>
  </header>
  <div class="messages" id="msgContainer">
    <div class="empty"><h2>DeepSeek-V4 Chat</h2><p>Start a new conversation</p></div>
  </div>
  <div class="input-bar" id="inputBar" style="display:none">
    <textarea id="userInput" rows="1" placeholder="Message..." onkeydown="onKey(event)"></textarea>
    <button class="btn-send" id="sendBtn" onclick="send()">Send</button>
  </div>
</main>

<!-- ── Settings ── -->
<aside class="settings" id="settings" style="display:none">
  <h3>Model Settings</h3>
  <div class="field"><label>Model</label><select id="sModel"><option value="deepseek-v4-pro">DeepSeek-V4 Pro</option><option value="deepseek-v4-flash">DeepSeek-V4 Flash</option></select></div>
  <div class="field"><label>Reasoning Effort</label><select id="sReason"><option value="high">High</option><option value="max">Max</option></select></div>
  <div class="field"><label>Temperature (<span id="tLabel">0.7</span>)</label><div class="range-row"><input type="range" id="sTemp" min="0" max="2" step="0.1" value="0.7" oninput="tLabel.textContent=this.value"><span class="val" id="tLabel">0.7</span></div></div>
  <div class="field"><label>Max Tokens</label><input type="number" id="sMax" value="4096" min="1" max="65536"></div>
  <div class="field"><label>Top P (<span id="pLabel">1.0</span>)</label><div class="range-row"><input type="range" id="sTopP" min="0" max="1" step="0.05" value="1.0" oninput="pLabel.textContent=this.value"><span class="val" id="pLabel">1.0</span></div></div>
  <div class="field"><label>System Prompt</label><textarea id="sSys">You are a helpful assistant.</textarea></div>
  <div class="field"><button class="btn-apply" onclick="applySettings()">Apply Settings</button></div>
  <div class="meta"><span id="branchMeta"></span><span id="msgMeta"></span></div>
  <div class="field"><button class="btn-apply" onclick="regenerate()" style="background:var(--bg3)" id="regenBtn">&#x21BB; Regenerate Last Reply</button></div>
</aside>

<script>
// ── State ──
let S = { convs:[], cid:null, bid:null, branches:[], msgs:[], streaming:false, editing:null,
          streamAbort:null };

const $ = (s) => document.querySelector(s);
const api = (url, opts={}) => fetch('/api'+url, opts).then(async r => { const d=await r.json(); if(!r.ok) throw new Error(d.error); return d; });

// ── Init ──
(async function init(){
  S.convs = await api('/conversations');
  renderConvs();
  if(S.convs.length===0) await newConv();
  else await openConv(S.convs[0].id);
})();

// ── Conversations ──
function renderConvs(){
  const l = $('#convList');
  if(S.convs.length===0){ l.innerHTML='<div class="list-empty">No conversations</div>'; return; }
  l.innerHTML = S.convs.map(c =>
    `<div class="conv-card${c.id===S.cid?' active':''}" onclick="openConv(${c.id})">
      <span class="title">${esc(c.title)}</span>
      <button class="close" onclick="event.stopPropagation();delConv(${c.id})">&times;</button>
    </div>`).join('');
}

async function newConv(){
  const c = await api('/conversations', {method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  S.convs = await api('/conversations'); renderConvs();
  await openConv(c.id);
}

async function delConv(id){
  if(!confirm('Delete this conversation?')) return;
  await api('/conversations/'+id, {method:'DELETE'});
  if(S.cid===id){ S.cid=null; S.msgs=[]; S.branches=[]; updateUI(); renderMsgs(); }
  S.convs = await api('/conversations'); renderConvs();
  if(S.convs.length>0 && !S.cid) await openConv(S.convs[0].id);
}

async function openConv(id){
  if(id===S.cid) return;
  S.cid=id; S.editing=null; cancelStream();
  const c = await api('/conversations/'+id);
  S.msgs = c.messages||[]; S.bid = c.active_branch_id;
  await loadBranches(); syncSettings(c);
  updateUI(); renderConvs(); renderMsgs();
}

async function reloadMsgs(){
  if(!S.cid) return;
  const c = await api('/conversations/'+S.cid);
  S.msgs = c.messages||[]; S.bid = c.active_branch_id;
}

// ── Branches ──
async function loadBranches(){
  S.branches = await api(`/conversations/${S.cid}/branches`);
  const sel = $('#branchSelect');
  sel.innerHTML = S.branches.map(b =>
    `<option value="${b.id}"${b.id===S.bid?' selected':''}>${esc(b.name)} (${b.msg_count})</option>`).join('');
  const b = S.branches.find(b => b.id===S.bid);
  if(b) $('#branchBadge').textContent = b.name;
}

async function switchBranch(){
  const newBid = Number($('#branchSelect').value);
  if(newBid===S.bid) return;
  S.editing=null; cancelStream();
  await api(`/conversations/${S.cid}/branches/switch`, {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({branchId:newBid})});
  await reloadMsgs(); await loadBranches(); renderMsgs(); updateMeta();
}

async function forkBranch(){
  const name = prompt('Branch name:', `fork-${Date.now()}`);
  if(!name) return;
  await api(`/conversations/${S.cid}/branches`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
  await reloadMsgs(); await loadBranches(); renderMsgs(); updateMeta();
  toast('Forked: '+name);
}

// ── Messages ──
function renderMsgs(){
  const c = $('#msgContainer');
  if(!S.msgs.length){ c.innerHTML='<div class="empty"><h2>DeepSeek-V4 Chat</h2><p>Send a message to start</p></div>'; return; }

  c.innerHTML = S.msgs.map((m, i) => {
    const e = S.editing===m.id;
    const body = m.role==='system' ? esc(m.content) : md(m.content);

    // Branch navigation for this message
    let branchNav = '';
    if (m.shared_branches && m.shared_branches.length > 1) {
      const idx = m.shared_branches.findIndex(b => b.branch_id === S.bid);
      const total = m.shared_branches.length;
      const cur = idx >= 0 ? idx + 1 : 1;
      const prev = idx > 0 ? m.shared_branches[idx - 1].branch_id : null;
      const next = idx < total - 1 ? m.shared_branches[idx + 1].branch_id : null;
      branchNav = `<div class="branch-nav">
        <button class="nav-arrow" ${prev!==null?'onclick="navToBranch('+prev+')"':'disabled'}>&lt;</button>
        <span class="nav-label">${cur}/${total}</span>
        <button class="nav-arrow" ${next!==null?'onclick="navToBranch('+next+')"':'disabled'}>&gt;</button>
      </div>`;
    }

    // Reasoning section for assistant messages
    let reasoningHtml = '';
    if (m.role==='assistant' && m.reasoning_content) {
      const rId = 'reasoning-' + m.id;
      reasoningHtml = `<div class="reasoning-wrap"><button class="reasoning-toggle" onclick="event.stopPropagation();this.classList.toggle('open');document.getElementById('${rId}').classList.toggle('open')"><span class="arrow">&#9654;</span> Thinking...</button><div class="reasoning-body" id="${rId}">${esc(m.reasoning_content)}</div></div>`;
    }

    if (m.role==='system') return `<div class="msg-wrap system"><div class="msg-bubble"><div class="role-tag">System</div><div class="bubble-body">${body}</div></div>${branchNav}</div>`;

    return `<div class="msg-wrap ${m.role}" id="r-${m.id}">
      <div class="msg-bubble${e?' editing':''}">
        <div class="role-tag">${m.role==='user'?'You':'Assistant'}</div>
        ${reasoningHtml}
        <button class="edit-trigger" onclick="startEdit(${m.id})">&#9998; Edit</button>
        <div class="bubble-body">${body}</div>
        <div class="edit-form">
          <textarea id="et-${m.id}">${esc(m.content)}</textarea>
          <div class="edit-row">
            <button class="btn-save" id="es-${m.id}" onclick="saveEdit(${m.id},'${m.role}')">Save</button>
            <button class="btn-cancel" onclick="cancelEdit()">Cancel</button>
            <span class="hint">${m.role==='user'?'New branch + auto reply':'New branch'}</span>
          </div>
        </div>
      </div>
      ${branchNav}
    </div>`;
  }).join('');

  c.scrollTop = c.scrollHeight;
}

async function navToBranch(branchId){
  S.editing=null; cancelStream();
  await api(`/conversations/${S.cid}/branches/switch`, {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({branchId})});
  await reloadMsgs(); await loadBranches(); renderMsgs(); updateMeta();
}

function startEdit(id){ S.editing=id; renderMsgs(); $('#et-'+id)?.focus(); }
function cancelEdit(){ S.editing=null; renderMsgs(); }

async function saveEdit(msgId, role){
  const content = $('#et-'+msgId).value.trim();
  if(!content) return;
  const btn = $('#es-'+msgId); btn.disabled = true; if(role==='user') btn.textContent = 'Regenerating...';
  try{
    const res = await api(`/conversations/${S.cid}/messages/${msgId}`, {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({content})});
    S.editing = null;
    await reloadMsgs(); await loadBranches(); renderMsgs(); updateMeta();
    toast(role==='user'?'Edited user msg → new branch, AI replied':'Edited AI reply → new branch');
  }catch(e){ alert(e.message); btn.disabled=false; }
}

// ── Streaming Send ──
async function send(){
  const inp = $('#userInput');
  const msg = inp.value.trim();
  if(!msg||S.streaming) return;
  if(!S.cid) await newConv();

  inp.value=''; inp.style.height='auto';
  S.streaming = true;
  $('#sendBtn').disabled = true;

  // Optimistic user message
  S.msgs.push({id:-Date.now(), role:'user', content:msg});
  renderMsgs();

  // Add AI bubble placeholder and loading
  const aiId = 'ai-stream';
  const p = document.createElement('div');
  p.className = 'msg-wrap assistant';
  p.id = aiId;
  p.innerHTML = '<div class="msg-bubble"><div class="role-tag">Assistant</div><div id="ai-reasoning-wrap" class="reasoning-wrap" style="display:none"><button class="reasoning-toggle" onclick="event.stopPropagation();this.classList.toggle(\'open\');this.nextElementSibling.classList.toggle(\'open\')"><span class="arrow">&#9654;</span> Thinking...</button><div class="reasoning-body" id="ai-reasoning"></div></div><div class="bubble-body" id="ai-body">thinking<span class="streaming-cursor"></span></div></div>';
  $('#msgContainer').appendChild(p);

  try{
    const res = await fetch(`/api/conversations/${S.cid}/chat`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:msg})
    });
    if (!res.ok) { const e = await res.json(); throw new Error(e.error); }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '', aiContent = '', aiReasoning = '', hasReasoning = false;
    S.streamAbort = () => reader.cancel();

    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += decoder.decode(value, {stream:true});
      const lines = buf.split('\n'); buf = lines.pop()||'';
      for(const line of lines){
        if(!line.startsWith('data: ')) continue;
        try{
          const d = JSON.parse(line.slice(6));
          if(d.error) throw new Error(d.error);
          if(d.reasoning){
            hasReasoning = true;
            aiReasoning += d.reasoning;
            const rw = document.getElementById('ai-reasoning-wrap');
            const rb = document.getElementById('ai-reasoning');
            if(rw) rw.style.display = 'block';
            if(rb) rb.textContent = aiReasoning;
          }
          if(d.delta){
            aiContent += d.delta;
            const body = document.getElementById('ai-body');
            if(body) body.innerHTML = md(aiContent)+'<span class="streaming-cursor"></span>';
          }
          if(d.done){
            const body = document.getElementById('ai-body');
            if(body) body.innerHTML = md(aiContent);
            if(!hasReasoning){
              const rw = document.getElementById('ai-reasoning-wrap');
              if(rw) rw.style.display = 'none';
            }
          }
        }catch(e){ throw e; }
      }
      $('#msgContainer').scrollTop = $('#msgContainer').scrollHeight;
    }

    // Reload from server for proper IDs
    await reloadMsgs(); renderMsgs();
    S.convs = await api('/conversations'); renderConvs();
    await loadBranches(); updateMeta();
  }catch(e){
    if(e.name!=='AbortError'){
      alert('Error: '+e.message);
      await reloadMsgs(); renderMsgs();
    }
  }finally{
    S.streaming = false; S.streamAbort = null;
    $('#sendBtn').disabled = false;
  }
}

function cancelStream(){ if(S.streamAbort){ S.streamAbort(); S.streamAbort=null; } S.streaming=false; $('#sendBtn').disabled=false; }

// ── Settings ──
function syncSettings(c){
  $('#sModel').value = c.model||'deepseek-v4-pro';
  $('#sTemp').value = c.temperature??0.7; tLabel.textContent = c.temperature??0.7;
  $('#sMax').value = c.max_tokens??4096;
  $('#sTopP').value = c.top_p??1.0; pLabel.textContent = c.top_p??1.0;
  $('#sSys').value = c.system_prompt||'You are a helpful assistant.';
  $('#sReason').value = c.reasoning_effort||'high';
}

async function applySettings(){
  if(!S.cid) return;
  await api(`/conversations/${S.cid}/settings`, {method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:$('#sModel').value, temperature:parseFloat($('#sTemp').value),
      max_tokens:parseInt($('#sMax').value), top_p:parseFloat($('#sTopP').value), system_prompt:$('#sSys').value,
      reasoning_effort:$('#sReason').value})});
  await reloadMsgs(); renderMsgs();
}

async function regenerate(){
  if(!S.cid||S.streaming) return;
  S.streaming=true; $('#regenBtn').disabled=true;
  try{
    await api(`/conversations/${S.cid}/regenerate`, {method:'POST'});
    await reloadMsgs(); renderMsgs(); updateMeta();
  }catch(e){ alert(e.message); }
  finally{ S.streaming=false; $('#regenBtn').disabled=false; }
}

// ── Helpers ──
function updateUI(){
  const v = !!S.cid;
  $('#mainHead').style.display=v?'flex':'none';
  $('#inputBar').style.display=v?'flex':'none';
  $('#settings').style.display=v?'flex':'none';
  if(v) updateMeta();
}
function updateMeta(){
  $('#branchMeta').textContent = S.branches.length+' branch(es)';
  $('#msgMeta').textContent = S.msgs.length+' messages';
}
function onKey(e){
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); }
  setTimeout(()=>{ const t=e.target; t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,180)+'px'; },0);
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(text){
  const d = document.createElement('div');
  d.className = 'fork-toast'; d.textContent = text;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 3100);
}

// ── Simple Markdown Parser ───────────────────────────────────────────────
function md(text){
  if(!text) return '';

  // Protect code blocks
  const blocks = [];
  let t = text.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    blocks.push('<pre><code>'+esc(code.trimEnd())+'</code></pre>');
    return '\x00B'+ (blocks.length-1) +'\x00';
  });

  // Protect inline code
  const inlines = [];
  t = t.replace(/`([^`]+)`/g, (_, code) => {
    inlines.push('<code>'+esc(code)+'</code>');
    return '\x00I'+ (inlines.length-1) +'\x00';
  });

  // Escape HTML in the rest
  t = esc(t);

  // Bold + Italic (***text***)
  t = t.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');

  // Bold
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  // Italic
  t = t.replace(/\*(.+?)\*/g, '<em>$1</em>');

  // Images
  t = t.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%;border-radius:8px">');

  // Links
  t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

  // Headers
  t = t.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  t = t.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  t = t.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  t = t.replace(/^# (.+)$/gm, '<h1>$1</h1>');

  // Blockquote
  t = t.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

  // Horizontal rule
  t = t.replace(/^---$/gm, '<hr>');

  // Unordered list items
  t = t.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');

  // Ordered list items
  t = t.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');

  // Wrap consecutive <li> in <ul>
  t = t.replace(/(<li>.*?<\/li>(\n|$))+/g, '<ul>$&</ul>');

  // Double newline = paragraph break
  t = t.replace(/\n\n+/g, '</p><p>');

  // Single newline = line break
  t = t.replace(/\n/g, '<br>');

  // Restore inline codes
  t = t.replace(/\x00I(\d+)\x00/g, (_, i) => inlines[+i]);

  // Restore code blocks
  t = t.replace(/\x00B(\d+)\x00/g, (_, i) => blocks[+i]);

  // Wrap in paragraph
  return '<p>'+t+'</p>';
}
